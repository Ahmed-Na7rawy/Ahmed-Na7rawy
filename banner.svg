<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.3" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="0.75" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=Space+Grotesk:wght@600&amp;display=swap');

    /* CSS Animations */
    @keyframes draw-line {
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes subtle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .bg { fill: url(#bg-gradient); }
    .grid-overlay { 
      fill: url(#grid); 
      transition: opacity 0.5s ease;
    }
    
    .title-text {
      font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: 3px;
      transition: fill 0.5s ease, letter-spacing 0.5s ease;
    }
    .subtitle-text {
      font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: #38ef7d;
      letter-spacing: 5px;
      transition: fill 0.5s ease, letter-spacing 0.5s ease;
    }
    
    .data-line-primary {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw-line 2.5s forwards cubic-bezier(0.4, 0, 0.2, 1);
      transition: stroke-width 0.5s ease, stroke 0.5s ease, filter 0.5s ease;
    }
    
    .glow-dot {
      filter: url(#glow);
      animation: pulse 3s infinite ease-in-out;
      transform-origin: center;
    }
    
    .glow-dot circle {
      transition: r 0.5s ease, fill 0.5s ease;
    }
    
    /* Interactive Hover States */
    svg:hover .title-text {
      fill: #00f2fe;
      letter-spacing: 4px;
    }
    svg:hover .subtitle-text {
      fill: #ffffff;
      letter-spacing: 6px;
    }
    svg:hover .data-line-primary {
      stroke-width: 4px;
      stroke: #00f2fe;
      filter: url(#glow);
    }
    svg:hover .glow-dot circle:first-child {
      r: 8px;
      fill: #ffdd54;
    }
    svg:hover .grid-overlay {
      opacity: 0.8;
    }

    .float-container {
      animation: subtle-float 6s infinite ease-in-out;
    }
  </style>

  <!-- Background and Grid -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" class="grid-overlay" />

  <!-- Minimalistic Data Visualizations (Background curves) -->
  <g opacity="0.3">
    <!-- Subtle Secondary Line -->
    <path class="data-line-primary" d="M -50 150 Q 150 90, 350 160 T 700 80 T 900 120" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" style="animation-delay: 0.5s;" />
  </g>

  <!-- Primary Glowing Data Line -->
  <path class="data-line-primary" d="M -20 120 Q 180 40, 380 140 T 780 70 T 850 90" fill="none" stroke="url(#line-grad-1)" stroke-width="2.5" />

  <!-- Data Nodes (Points of Analysis) -->
  <g class="glow-dot" style="animation-delay: 1s;">
    <circle cx="180" cy="73" r="5" fill="#00f2fe" />
    <circle cx="180" cy="73" r="2" fill="#ffffff" />
  </g>
  <g class="glow-dot" style="animation-delay: 1.5s;">
    <circle cx="380" cy="140" r="5" fill="#38ef7d" />
    <circle cx="380" cy="140" r="2" fill="#ffffff" />
  </g>
  <g class="glow-dot" style="animation-delay: 2s;">
    <circle cx="580" cy="105" r="5" fill="#00f2fe" />
    <circle cx="580" cy="105" r="2" fill="#ffffff" />
  </g>

  <!-- Center Typography -->
  <g transform="translate(400, 100)">
    <g class="float-container">
      <!-- Title -->
      <text y="-15" class="title-text" text-anchor="middle">AHMED AMR ALNAHRAWY</text>
      <!-- Subtitle -->
      <text y="35" class="subtitle-text" text-anchor="middle">DATA SCIENCE • ANALYTICS</text>
    </g>
  </g>
</svg>
